[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redevops-mission"
version = "0.2.0a0"
description = "Mission SDK — the developer boundary over the ReDevOps Mission Runtime (author, validate, explain, run, replay a governed MissionProgram)."
requires-python = ">=3.10"
readme = "README.md"
# Permissive by design: the SDK is the developer boundary + compatibility target, so it is Apache-2.0
# (build against it freely; implement conforming runtimes). The reference runtime `agentic-os` is AGPL-3.0
# — running the SDK against it still carries the runtime's AGPL for a served combined work.
license = "Apache-2.0"
license-files = ["LICENSE"]
# NOTE: with the PEP 639 SPDX `license` field above, a `License ::` classifier is forbidden
# (setuptools>=77 raises InvalidConfigError). Keep only non-license classifiers here.
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
]
# The one runtime dependency. Parity checked against the SDK's actual import surface (see PARITY.md):
# the public `agentic-os` runtime satisfies the SDK contract exactly. Pinned to the current `main` commit
# (public is untagged); switch to `agentic-os==0.1.0aN` once a release is tagged. `AGENTIC_OS_SRC` is a
# dev-only override.
dependencies = [
  "agentic-os @ git+https://github.com/redevops-io/agentic-os.git@63c0b255cb9f6b3c64ca9c62791e65975963ef56",
]

[project.scripts]
rdo = "redevops_mission.cli:main"

[tool.setuptools.packages.find]
include = ["redevops_mission*"]
